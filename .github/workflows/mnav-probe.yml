name: mnav-probe
on:
  push:
    branches: [mnav-probe]
    paths: ["probe.py", ".github/workflows/mnav-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - name: Commit results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "probe results" || echo "nothing to commit"
          git push
